<p class="eyebrow">Atelier IA · Direction d'école</p>

<h2>L'IA au service de <span class="gradient">l'école</span></h2>

- Claude Entreprise: comprendre, démarrer, **rester maître de ses données**
- Environ 2 heures, avec une pause
- Ce support se relit seul, après la séance
- Les personnes et les documents de démo sont fictifs: ce support sert à apprendre

Note: Se présenter en une phrase. Dire que le support est fait pour continuer seuls: chaque slide porte une idée complète, et la fin dit quoi faire dès demain. Ce qu'on ne voit pas aujourd'hui passe en séance 2.
---
## Trois objectifs pour aujourd'hui
1. **Démarrer rapidement avec Claude**: faire une vraie tâche, lui donner le bon contexte, et **vérifier** ce qu'il rend
2. **Comprendre l'IA agentique et les possibilités de Claude**: ce qu'il peut faire pour vous, et les règles à suivre avec les données de l'école
3. **Comprendre la valeur d'un système IA souverain**: un système qui vous connaît, et **qui vous appartient**

De ce système, on voit un aperçu aujourd'hui (partie 7). On le construit ensuite, avec chacun de vous: c'est **la phase 2**.

La loi européenne sur l'IA demande au collège de **développer la culture IA** de son personnel: cet atelier en fait partie.

Note: ESSENTIEL. Trois objectifs seulement: on ne peut pas tout faire en deux heures. Le reste du support se relit seul. Pour la loi: l'article 4 de l'AI Act a été modifié en 2026. Il demande aux organisations de prendre des mesures pour développer la culture IA de leur personnel; il n'impose pas une formation obligatoire (page de la Commission européenne sur la culture IA, lue le 13/11/2026). Ne pas dire que cet atelier "met le collège en règle".
---
## Au programme
1. Le même Claude, deux réponses
2. Prise en main: l'application, les modèles, l'effort
3. Première démo, sur votre PC: la circulaire
4. Comprendre ce qu'on vient de voir
5. Le contexte et sa gestion
6. Cowork, les démos, et **votre vraie tâche**
7. Un système qui vous connaît, et qui vous appartient
8. Prudence et règles d'usage
9. Démarrer demain, et vos questions

Et 9 parties bonus, à parcourir après la séance.

Note: À PASSER si le temps manque. Timing visé (début à 10h): 0:08 fin de la partie 1, 0:16 fin de la partie 2, 0:26 fin de la circulaire, 0:35 fin de la partie 4, 0:45 fin de la partie 5, pause jusqu'à 0:55, 1:30 fin de la partie 6 (avec leur vraie tâche, 15 minutes), 1:42 fin de la partie 7, 1:47 fin de la partie 8, 1:58 fin de la partie 9 (avec leurs questions). Trois repères à tenir: la pause commence à 0:45; la vraie tâche commence à 1:08 au plus tard; la partie 8 commence à 1:42. Dans chaque partie, les notes disent "ESSENTIEL" ou "À PASSER": en séance, je montre seulement les slides essentielles. Le reste est pour la relecture.
---
## Comment on travaille
- **Chacun sur son PC**: vous faites les démos avec moi
- Le dossier "Fichiers de démo" est sur votre PC. **Tout y est fictif**
- La règle sur les données: pendant l'atelier, **aucune donnée d'élève**. Ensuite, seulement avec l'accord du collège et du DPO, et seulement dans le compte Claude du collège (partie 8)
- Vous avez choisi **une vraie tâche** à vous (sans données sensibles): on la fait ensemble, juste après la pause
- **N'hésitez pas à m'interrompre.** Si une réponse prend trop de temps, on la note, et on y revient à la fin

Note: ESSENTIEL. Dire la règle sur les données maintenant, avant la première démo, et pas seulement dans la partie 8. Poser une feuille sur la table pour noter les questions à reprendre à la fin, ou par la suite (par mail ou en séance 2). Vérifier que chacun a ouvert l'application Claude et le dossier "Fichiers de démo".
---
## Avant de commencer: les prérequis
1. **L'application Claude** est ouverte. En bas à gauche, vous voyez **le nom du collège**: c'est le bon compte
2. **Google Chrome** est ouvert, avec l'extension **Claude in Chrome** connectée au même compte. Chrome, même si vous utilisez Edge: l'extension ne marche que dans Chrome
3. Le dossier **"Fichiers de démo"** est sur votre Bureau, **hors OneDrive**: pour l'atelier, il nous faut des fichiers qui sont vraiment sur le PC
4. Dans la zone de saisie de Claude, vous voyez le choix **"Cowork"**, et le modèle **Opus 5.5** dans la liste des modèles

Note: À PASSER si le temps manque. VÉRIFICATION DES PRÉREQUIS (10 minutes avant le début, ou la veille par mail).
Claude Desktop: 1) Aller sur [claude.ai/download](https://claude.ai/download) et choisir Windows (ou Mac). 2) Lancer l'installateur. 3) Ouvrir Claude, cliquer sur "Se connecter", et choisir la connexion du collège (connexion unique si l'admin l'a activée, sinon l'adresse mail du collège). 4) En bas à gauche, vérifier le nom et l'organisation du collège: pas un compte personnel.
Claude in Chrome: 0) Si le PC n'a que Edge, installer Google Chrome ([google.com/chrome](https://www.google.com/chrome/)). Le centre d'aide d'Anthropic dit que Claude in Chrome n'est pas pris en charge dans les autres navigateurs Chromium, donc pas dans Edge (seul Claude Code, l'outil des développeurs, accepte Edge). Garder Edge pour le reste si on veut, et se connecter une fois dans Chrome aux sites utiles (Outlook, OneDrive). 1) Dans Chrome, aller sur [claude.com/chrome](https://claude.com/chrome) et cliquer sur "Ajouter à Chrome" (Chrome Web Store). 2) Épingler l'extension: icône en forme de pièce de puzzle, puis la punaise à côté de Claude. 3) Cliquer sur l'icône Claude et se connecter avec le même compte. 4) Accepter les permissions demandées. Si l'extension est bloquée, l'admin doit l'activer pour l'organisation.
Test rapide: dans l'application, "Bonjour, dis-moi en une phrase ce que tu peux faire". Dans Chrome, ouvrir une page web et demander "Résume cette page en trois points".
Si un PC bloque l'installation: travailler à deux sur un PC, ou utiliser [claude.ai](https://claude.ai) dans le navigateur (sans les démos sur un dossier). À vérifier en plus sur chaque PC, avec une liste imprimée: Cowork n'est pas coupé par l'admin, Opus 5.5 est permis, l'extension est bien reliée à l'application, et un dossier hors OneDrive s'ouvre comme dossier de travail. Si Cowork est coupé: faire les démos de la partie 6 sur mon écran, et leur vraie tâche dans le chat, avec des fichiers joints.

<p class="eyebrow">Partie 1 sur 9 · 8 min</p>

<h2>1. Le même Claude, deux <span class="gradient">réponses</span></h2>

Même machine, même question. **Une seule différence**.

Faites-le sur votre PC, dans une nouvelle conversation:

> Écris un mot aux parents pour la sortie scolaire.

Puis, dans une autre nouvelle conversation, le texte de la slide suivante.

Note: ESSENTIEL.
---
## Avec contexte
> Je suis Hélène Dufour, directrice de la section primaire de l'École fondamentale Saint-Exemple, une école fondamentale libre en Belgique. Écris un mot aux parents des 22 élèves de 4e primaire (classe de M. Marchal) pour la sortie au musée des Sciences naturelles, à Bruxelles, le jeudi 26 novembre. Départ de l'école en car à 8h30, retour vers 15h30. Prix: 12 euros par enfant, à payer avant le 19 novembre par virement, avec en communication le nom de l'enfant et "musée P4". Prévoir un pique-nique, une boisson et des vêtements selon la météo. Ton chaleureux mais court, 120 mots maximum, vouvoiement, signé "Hélène Dufour, directrice". Ajoute un talon-réponse à rendre à l'enseignant.

Note: ESSENTIEL. Chacun copie le texte tel quel, sans rien modifier: l'école et les personnes sont fictives. Laisser 2 minutes. Pour la direction du secondaire: remplacer par une classe de 2e secondaire. Puis mettre les deux réponses côte à côte: laquelle est utilisable telle quelle?
---
## Ce qu'on vient de voir
- La première réponse est **générique**: Claude ne sait rien de votre école
- La deuxième est **utilisable**: elle a l'école, la classe, la date, le prix, le ton
- La machine est la même. **Seul le contexte change**
- Et si Claude savait déjà tout ça, sans que vous l'écriviez? On verra ça dans la partie 7

Note: ESSENTIEL.

    }
    const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
    const ICON_DONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';
    function addCopyButtons() {
      // boxed prompts: a "Copier" button in the corner
      document.querySelectorAll('.reveal .slides blockquote').forEach((bq) => {
        if (bq.closest('aside')) return;
        const text = bq.innerText.trim();
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'copy-btn'; b.textContent = 'Copier'; b.title = 'Copier la demande';
        b.addEventListener('click', async (ev) => {
          ev.stopPropagation(); await copyText(text); b.blur();
          b.textContent = 'Copié'; b.classList.add('done');
          setTimeout(() => { b.textContent = 'Copier'; b.classList.remove('done'); }, 2000);
        });
        bq.appendChild(b);
      });
      // short prompts inside the text: click the text or the icon
      document.querySelectorAll('.reveal .slides .cp').forEach((sp) => {
        if (sp.closest('aside')) return;
        const text = sp.innerText.trim().replace(/^"|"$/g, '');
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'copy-ico'; b.innerHTML = ICON_COPY; b.setAttribute('aria-label', 'Copier la demande');
        sp.title = 'Cliquer pour copier';
        // keep the icon on the same line as the last word
        const w = document.createTreeWalker(sp, NodeFilter.SHOW_TEXT); let last = null; while (w.nextNode()) last = w.currentNode;
        const tail = document.createElement('span'); tail.className = 'tail';
        if (last) { const end = last.splitText(last.data.lastIndexOf(' ') + 1); end.parentNode.replaceChild(tail, end); tail.appendChild(end); } else sp.appendChild(tail);
        tail.appendChild(b);
        sp.addEventListener('click', async (ev) => {
          ev.stopPropagation(); await copyText(text); b.blur();
          b.innerHTML = ICON_DONE; sp.classList.add('done');
          setTimeout(() => { b.innerHTML = ICON_COPY; sp.classList.remove('done'); }, 2000);
        });
      });
    }
    // a chart with several frames (class "fr") shows them one after the other, three seconds each
    function animateFrames() {
      const charts = Array.from(document.querySelectorAll('.reveal .chart')).filter((c) => c.querySelector('.fr'));
      if (!charts.length) return;
      let step = 0;
      const show = () => charts.forEach((c) => { const fr = c.querySelectorAll('.fr'); fr.forEach((g, i) => { g.style.opacity = i === step % fr.length ? 1 : 0; }); });
      show(); setInterval(() => { step += 1; show(); }, 3000);
    }
    Reveal.initialize({ hash: true, slideNumber: 'c/t', transition: 'fade', width: 1280, height: 720, margin: 0.06, center: false,
      plugins: [ RevealMarkdown, RevealNotes ] }).then(() => { drawDiagrams(); document.querySelectorAll('.reveal a[href^="http"]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; }); addCopyButtons(); animateFrames(); Reveal.layout(); });
  </script>
</body>
