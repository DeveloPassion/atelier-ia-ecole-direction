<h2>2. Prise en <span class="gradient">main</span></h2>
Claude est l'IA de la société Anthropic. Le collège l'utilise en abonnement Entreprise.

- D'autres IA existent: ChatGPT, Gemini, Mistral, Copilot
- Elles fonctionnent toutes sur le même principe
- Ce que vous apprenez ici vaut aussi pour elles
---
## L'application Claude
- À gauche: vos conversations et vos projets Claude
- Au centre: la conversation
- En bas: la zone de saisie, pour écrire, joindre un fichier, choisir le modèle et l'effort
- À droite: les artefacts, ce que Claude crée pour vous (document, présentation, tableau)
- Dans les paramètres: les connecteurs, les skills, la mémoire

Note: TOUR DE L'APPLICATION (4 min), chacun sur son PC. Montrer chaque zone en une phrase. Ouvrir les paramètres et montrer Connecteurs et Skills sans rien changer. Montrer aussi l'extension Claude in Chrome dans Chrome.
---
## Un seul Claude
- Depuis septembre 2026, le chat et Cowork sont réunis
- Vous écrivez ce que vous voulez. Claude choisit: répondre vite, ou faire un travail plus long
- Vous pouvez l'arrêter, le corriger, ou changer l'effort à tout moment
- Il peut continuer une tâche longue pendant que vous faites autre chose
---
## Les commandes
- Tapez "/" dans la zone de saisie
- Une liste s'ouvre: les skills et les commandes disponibles
- Choisissez-en une au lieu de tout réexpliquer
- Exemple: une skill "mot aux parents" écrit toujours dans le ton de l'école

Note: Montrer le menu "/" en direct. Si aucune skill n'est installée sur leur compte, le dire et revenir aux skills dans la partie 4.
---
## Les modèles
| Modèle | Pour quoi |
|---|---|
| Sonnet 5.5 | Les tâches simples: un mail, une reformulation, un résumé court |
| Opus 5.5 | Le gros du travail: une circulaire, un tableau, un dossier |
| Haiku | Rapide et léger |
| Fable | Le plus puissant, et le plus coûteux |

Ça bouge très vite: de nouveaux modèles sortent tous les quelques mois. Cette recommandation date de novembre 2026.

Note: Sur Entreprise, l'usage se paie au volume. Vérifier avant la séance que l'admin autorise Sonnet 5.5 et Opus 5.5.
---
## Le niveau d'effort
L'effort dit combien de travail Claude met dans une tâche.

- Effort bas: rapide. Une première version, à corriger ensemble
- Effort haut: plus long. Il vérifie, il teste, il décide plus de choses seul
- Plus d'effort coûte plus de temps et plus d'usage
- On donne 1 heure pour une tâche: on rend une première version. On donne 12 heures: on vérifie tout. Claude lit l'effort de la même façon

Note: Analogie de Thariq Shihipar (Anthropic), article "Spending your effort", 2026-09-25.
---
## Quel effort choisir
- Effort bas: brainstorming, brouillon, petite correction
- Effort moyen: le travail courant
- Effort haut: ce qui doit être juste (les dates d'une circulaire, les chiffres d'un tableau)
- Moins vous précisez, plus Claude décide à votre place. Une demande précise est le levier le moins cher

<p class="system"><b>Pour un système qui vous connaît:</b> le modèle et l'effort comptent moins quand Claude sait déjà ce que vous voulez.</p>

  <script>
    const render = (window.Pele && window.Pele.render) || null;
    function drawDiagrams() {
      if (!render) return;
      document.querySelectorAll('.reveal pre code.mermaid, .reveal pre code.language-mermaid').forEach((code) => {
        const pre = code.closest('pre');
        try { const { svg } = render(code.textContent); const d = document.createElement('div'); d.className = 'diagram pele'; d.innerHTML = svg; pre.replaceWith(d); }
        catch (e) { console.warn('Diagram failed', e); }
      });
    }
    Reveal.initialize({ hash: true, slideNumber: 'c/t', transition: 'fade', width: 1280, height: 720, margin: 0.06,
      plugins: [ RevealMarkdown, RevealNotes ] }).then(() => { drawDiagrams(); Reveal.layout(); });
