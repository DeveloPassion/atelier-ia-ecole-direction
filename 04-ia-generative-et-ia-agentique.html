<h2>4. Comprendre ce qu'on vient de <span class="gradient">voir</span></h2>

L'IA générative: une IA qui **crée du contenu** (texte, image, son, vidéo, code), au lieu de seulement classer des données.

- **Statistique, pas déterministe**: même demande, **deux réponses différentes**
- Plus de paramètres: plus de capacités, et **plus de coût**. Mais la taille ne fait pas tout

Note: À PASSER si le temps manque. Quatre idées en une image. La demande: vos instructions, plus le contexte. Le fournisseur: la société qui fait tourner le modèle (ici Anthropic); c'est par lui que passent votre compte, vos données et la facture. Le modèle: des milliards de paramètres, réglés pendant l'entraînement; il calcule la suite la plus probable, donc il ne donne pas deux fois exactement la même réponse. La réponse: du texte, mais aussi une image, du code, une vidéo. Les tailles sont des ordres de grandeur, d'un petit modèle qui tourne sur un PC aux plus gros modèles.

## Le prompt
Le prompt, c'est la demande que vous écrivez: **une partie du contexte**, pas tout. La recette, en six points:

1. **Qui vous êtes**
2. **Ce que vous voulez**
3. **Pour qui**
4. **Sous quelle forme** (longueur, ton, liste ou texte)
5. **Un exemple**, si vous en avez un
6. **Les règles et les critères** d'un bon résultat

**Commencez simple**: ajoutez des consignes seulement si le résultat ne convient pas.

Note: ESSENTIEL. C'est la même recette partout dans le cours: ici, dans "votre vraie tâche" (partie 9), dans le bonus 11 et sur l'aide-mémoire. Pourquoi commencer simple: les modèles ont besoin de moins en moins d'aide (bonus 11).
---
## Trois astuces pour vos demandes
- Mettez **les informations et les règles importantes à la fin**: la fin d'un long texte est mieux lue que le milieu
- Demandez-lui de **vous poser des questions** avant de commencer: <span class="cp">"Pose-moi des questions si besoin."</span> Il propose souvent des choix à cliquer: c'est très rapide
- Les techniques de prompting (exemples, rôles, étapes, critères): **bonus 11**

- Claude prédit ce qui est probable, **pas ce qui est vrai**. Il peut inventer un fait, une date, une source, avec aplomb: c'est une **hallucination**
- Règle: les faits, les chiffres et les sources **se vérifient toujours**. Demandez **la phrase exacte et la page**: son niveau de confiance est un indice, pas une preuve

Une analogie: un stagiaire très cultivé, très rapide, qui ne vous connaît pas, et qui **n'ose jamais dire** "je ne sais pas".

Note: ESSENTIEL.

## La complaisance
- Claude a tendance à **vous donner raison**: il flatte, il évite de vous contredire
- Il a appris à plaire, pas à dire la vérité qui dérange
- Le risque: il valide une mauvaise idée, un calcul faux, une décision fragile
- La parade: demandez-lui de **critiquer**. <span class="cp">"Qu'est-ce qui cloche dans ce plan?"</span>, <span class="cp">"Joue l'avocat du diable"</span>, <span class="cp">"Donne-moi les trois meilleures objections"</span>

Note: ESSENTIEL. C'est le risque le plus utile à connaître pour une direction: on utilise Claude pour vérifier ses propres décisions, et il a tendance à les approuver. Le montrer en direct si le temps le permet: proposer une idée discutable, puis demander "Qu'est-ce qui cloche?".

| Bon pour | Moins bon pour |
|---|---|
| Rédiger, reformuler | Les faits précis |
| Résumer, traduire | Les chiffres |
| Structurer, trier | Les sources |
| Trouver des idées | L'actualité, sans recherche web |

Attention: il peut être brillant sur une tâche et rater la tâche voisine. **Testez-le sur vos vraies tâches**, et plus d'une fois.

## Pas seulement du texte
- **Lire des images**: une photo d'une page écrite à la main, une capture d'écran, un tableau photographié deviennent du texte ou un tableau
- **Créer des visuels**: un schéma, une affiche simple, une infographie. Pour des images réalistes, d'autres outils existent
- **Créer des animations courtes**
- **Créer des petits jeux et des applications**: un quiz pour une classe, un jeu de calcul mental, un outil de tirage au sort, en quelques minutes

Note: À PASSER si le temps manque. Exemple à dire: "Crée un jeu de calcul mental pour des élèves de 2e primaire, avec un score." Claude le construit dans un artefact, et on peut y jouer tout de suite. Pour les animations: Claude Motion existe sur Team et Enterprise, mais il est désactivé par défaut sur Enterprise.

## Tout ce que vous faites sur votre PC, Claude peut le faire
Ce que vous pouvez faire sur votre ordinateur, dans le navigateur ou sur le réseau, un agent peut le faire aussi. **Avec votre accord.**

- **Fichiers**: lire, écrire, renommer, ranger un dossier entier
- **Documents**: créer des Word, des Excel, des PDF, des présentations
- **Web**: ouvrir des pages, les lire, chercher, remplir un formulaire
- **Messages**: préparer et envoyer des mails, lire un agenda (avec un connecteur)
- **Applications**: cliquer et taper dans une application, comme vous (pas encore sur l'abonnement Entreprise)

La limite n'est plus ce que l'IA sait faire, mais **ce que vous lui permettez** de faire.

Note: À PASSER si le temps manque. Dire que c'est le grand changement de 2025-2026: on passe d'une IA qui répond à une IA qui fait. Donner un exemple de la matinée: la circulaire, Claude l'a lue et en a fait un tableau. Annoncer les démos de la partie 6 (fichiers, dossier, navigateur, présentation). Faire le lien avec la partie 8: plus un agent peut faire, plus il faut choisir ce qu'on lui permet.

## Les connecteurs: brancher vos outils
- Un **connecteur** relie Claude à un service que vous utilisez déjà: Google Drive, OneDrive, Outlook, votre agenda
- Claude peut alors **y chercher et y lire**, et parfois y agir, avec **votre propre compte**
- Derrière: MCP (Model Context Protocol), une **prise standard** que Claude, ChatGPT et d'autres IA utilisent
- Chaque connecteur ajoute des possibilités, et aussi des risques: **n'activez que ce qui sert** (détail: bonus 13)

```mermaid
flowchart LR
  C[Claude] --- M[Connecteurs MCP] --- O[Google Drive, OneDrive, Outlook, agenda]
```

## Les skills
- Une skill, c'est **une façon de faire**, écrite une fois, que Claude suit chaque fois. Dans l'application en français: une "compétence"
- Exemples pour l'école
    - "Comment j'écris aux parents": le ton, la longueur, la signature
    - "Comment je trie une circulaire": ce qui concerne mon niveau, le format du tableau
- Claude charge une skill seulement quand il en a besoin
- On l'appelle avec "/", ou Claude la choisit seul

<p class="system"><b>Pour un système qui vous connaît:</b> les skills appliquent vos processus écrits. C'est le cœur d'un système qui vous connaît. Le détail: bonus 14.</p>

      document.execCommand('copy'); t.remove();
    }
    const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
    const ICON_DONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';
    function addCopyButtons() {
      // boxed prompts: a "Copier" button in the corner
      document.querySelectorAll('.reveal .slides blockquote').forEach((bq) => {
        if (bq.closest('aside')) return;
        const text = bq.innerText.trim();
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'copy-btn'; b.textContent = 'Copier'; b.title = 'Copier la demande';
        b.addEventListener('click', async (ev) => {
          ev.stopPropagation(); await copyText(text); b.blur();
          b.textContent = 'Copié'; b.classList.add('done');
          setTimeout(() => { b.textContent = 'Copier'; b.classList.remove('done'); }, 2000);
        });
        bq.appendChild(b);
      });
      // short prompts inside the text: click the text or the icon
      document.querySelectorAll('.reveal .slides .cp').forEach((sp) => {
        if (sp.closest('aside')) return;
        const text = sp.innerText.trim().replace(/^"|"$/g, '');
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'copy-ico'; b.innerHTML = ICON_COPY; b.setAttribute('aria-label', 'Copier la demande');
        sp.title = 'Cliquer pour copier';
        // keep the icon on the same line as the last word
        const w = document.createTreeWalker(sp, NodeFilter.SHOW_TEXT); let last = null; while (w.nextNode()) last = w.currentNode;
        const tail = document.createElement('span'); tail.className = 'tail';
        if (last) { const end = last.splitText(last.data.lastIndexOf(' ') + 1); end.parentNode.replaceChild(tail, end); tail.appendChild(end); } else sp.appendChild(tail);
        tail.appendChild(b);
        sp.addEventListener('click', async (ev) => {
          ev.stopPropagation(); await copyText(text); b.blur();
          b.innerHTML = ICON_DONE; sp.classList.add('done');
          setTimeout(() => { b.innerHTML = ICON_COPY; sp.classList.remove('done'); }, 2000);
        });
      });
    }
    // a chart with several frames (class "fr") shows them one after the other, three seconds each
    function animateFrames() {
      const charts = Array.from(document.querySelectorAll('.reveal .chart')).filter((c) => c.querySelector('.fr'));
      if (!charts.length) return;
      let step = 0;
      const show = () => charts.forEach((c) => { const fr = c.querySelectorAll('.fr'); fr.forEach((g, i) => { g.style.opacity = i === step % fr.length ? 1 : 0; }); });
      show(); setInterval(() => { step += 1; show(); }, 3000);
    }
    Reveal.initialize({ hash: true, slideNumber: 'c/t', transition: 'fade', width: 1280, height: 720, margin: 0.06, center: false,
      plugins: [ RevealMarkdown, RevealNotes ] }).then(() => { drawDiagrams(); document.querySelectorAll('.reveal a[href^="http"]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; }); addCopyButtons(); animateFrames(); Reveal.layout();
        const next = () => document.querySelector('.nav-next').classList.toggle('show', Reveal.isLastSlide());
        next(); Reveal.on('slidechanged', next); });
  </script>
</body>
