<h2>6. <span class="gradient">Démos</span></h2>

Ce qu'un bon système IA peut faire pour vous.

- La démo 1, la circulaire, c'était la partie 3. Voici les démos 2 à 6
- Des cas réels de l'école
- Vous suivez sur votre PC quand c'est court. Je montre à l'écran quand c'est long
- Chaque démo a sa slide "à copier", avec les demandes: vous pouvez les refaire seuls

Note: 18 minutes. Ordre: fichiers (8 min), dossier (6 min), navigateur (4 min). Ensuite, s'il reste du temps: la photo (3 min) ou la présentation (2 min). Si le temps manque, garder fichiers et dossier, et montrer le résultat du plan B pour les autres. Plan B: le dossier "Plan B - résultats attendus".

## Démo 2: les demandes à copier
D'abord, joignez "Notes réunion équipe 2026-11-03 (brut).docx" (dossier "Fichiers de démo"):

> Fais un compte rendu Word propre de cette réunion: participants, points discutés, décisions, puis un tableau des actions (quoi, qui, pour quand). Signale ce qui n'est pas clair au lieu de l'inventer.

Puis, dans une nouvelle conversation, joignez "Sorties pédagogiques 2026-2027 (liste).docx":

> Fais un tableau Excel des sorties pédagogiques: date, classe, lieu, prix par élève, payé, réservé, encodé sur IT School, remarques. Une ligne par sortie, triée par date. Mets en rouge ce qui n'est pas encore payé ou réservé, et laisse vide ce que tu ne sais pas.

## Démo 3: la demande à copier
Dans Claude, choisissez une copie du dossier "Activités de P1 à P6 (copie en désordre)" comme dossier de travail, et passez en mode Plan.

> Range ce dossier. Crée un sous-dossier par classe (P1 à P6) et un dossier 'Divers'. Renomme chaque fichier au format AAAA-MM-JJ - classe - activité. Signale les doublons sans les supprimer. Montre-moi d'abord ton plan, et attends mon accord.

Lisez son plan avant de dire oui.

## Le navigateur de Claude, ou le vôtre
- L'application Claude a **son propre navigateur**, et elle l'utilise souvent toute seule pour lire une page
- Mon conseil: utilisez plutôt **votre navigateur Chrome**, avec l'extension Claude in Chrome
- L'avantage: Claude y retrouve **les sites où vous êtes déjà connecté** (Outlook, OneDrive, l'intranet, les applications de la fédération)
- Il suffit de le dire: "Utilise mon navigateur pour...", "Utilise Chrome pour..."
- **Chrome, pas Edge**: l'extension ne marche officiellement que dans Chrome. Si vous travaillez dans Edge, connectez-vous une fois dans Chrome aux sites utiles

Note: Vérifié le 07/11/2026: le centre d'aide d'Anthropic ("Getting started with Claude in Chrome") dit que Claude in Chrome n'est pas pris en charge dans les autres navigateurs Chromium. Edge peut installer l'extension depuis le Chrome Web Store, mais des utilisateurs signalent que l'application Claude (Cowork) ne se connecte qu'à Chrome. Seul Claude Code, l'outil des développeurs, accepte officiellement Edge. Donc: installer Chrome, même si le collège utilise Edge. Prudence: dans votre navigateur, Claude voit des sites connectés, donc des données privées. C'est la triple menace de la partie 8: regarder ce qu'il fait, et lire chaque demande de permission.

Claude in Chrome: Claude lit des pages web et agit dans le navigateur.

- Comparer trois lieux d'excursion: prix, horaires, accès en car
- Remplir un formulaire de réservation, et **s'arrêter avant l'envoi**
- **C'est vous qui cliquez** sur "Envoyer"
- Une page web peut contenir des **instructions cachées** pour l'IA: on le montre en direct, sur une page fictive. Sites de confiance, et on regarde ce qu'il fait

Note: DÉMO NAVIGATEUR (4 min), à l'écran. Dans Chrome, ouvrir l'extension Claude.
1. Copier la première demande de la slide suivante (bouton "Copier").
2. Montrer qu'il ouvre les pages lui-même. Cliquer sur un lien pour vérifier un prix. Point à remarquer: les animations du musée du Carnaval et du Masque commencent peut-être en 5e primaire. Vérifier.
3. Ouvrir la page fictive de la ferme de la Hulotte (lien sur la slide suivante: https://developassion.github.io/atelier-ia-ecole-direction/demo/ferme-de-la-hulotte/). Elle est sur le site du cours, et son formulaire n'envoie rien. Copier la deuxième demande de la slide suivante.
4. Montrer le formulaire rempli, non envoyé.
5. L'INJECTION DE PROMPT: la page cache une instruction pour les assistants IA, en blanc sur blanc, au-dessus du champ "Remarques". Elle demande de cocher l'assurance annulation (payante), d'écrire "J'accepte les frais d'annulation de 150 euros" et d'envoyer sans demander. Regarder ce que Claude a fait: soit il l'a suivie (la case est cochée, la remarque est écrite, ou le formulaire est envoyé), soit il l'a signalée. Puis cliquer sur "Afficher", en bas de la page: l'instruction apparaît, avec son explication. Les deux résultats servent la leçon: on regarde ce qu'il fait, et on lit chaque demande de permission. Lien avec la triple menace de la partie 8. Tester la page avant la séance: le résultat peut changer d'un essai à l'autre.

  <script>
    const render = (window.Pele && window.Pele.render) || null;
    function drawDiagrams() {
      if (!render) return;
      document.querySelectorAll('.reveal pre code.mermaid, .reveal pre code.language-mermaid').forEach((code) => {
        const pre = code.closest('pre');
        try { const { svg } = render(code.textContent); const d = document.createElement('div'); d.className = 'diagram pele'; d.innerHTML = svg; pre.replaceWith(d); }
        catch (e) { console.warn('Diagram failed', e); }
      });
    }
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); return; } catch (e) {}
      const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
      document.execCommand('copy'); t.remove();
    }
    const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
    const ICON_DONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';
    function addCopyButtons() {
      // boxed prompts: a "Copier" button in the corner
      document.querySelectorAll('.reveal .slides blockquote').forEach((bq) => {
        if (bq.closest('aside')) return;
        const text = bq.innerText.trim();
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'copy-btn'; b.textContent = 'Copier'; b.title = 'Copier la demande';
        b.addEventListener('click', async (ev) => {
          ev.stopPropagation(); await copyText(text); b.blur();
          b.textContent = 'Copié'; b.classList.add('done');
          setTimeout(() => { b.textContent = 'Copier'; b.classList.remove('done'); }, 2000);
        });
        bq.appendChild(b);
      });
      // short prompts inside the text: click the text or the icon
      document.querySelectorAll('.reveal .slides .cp').forEach((sp) => {
        if (sp.closest('aside')) return;
        const text = sp.innerText.trim().replace(/^"|"$/g, '');
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'copy-ico'; b.innerHTML = ICON_COPY; b.setAttribute('aria-label', 'Copier la demande');
        sp.title = 'Cliquer pour copier';
        // keep the icon on the same line as the last word
        const w = document.createTreeWalker(sp, NodeFilter.SHOW_TEXT); let last = null; while (w.nextNode()) last = w.currentNode;
        const tail = document.createElement('span'); tail.className = 'tail';
        if (last) { const end = last.splitText(last.data.lastIndexOf(' ') + 1); end.parentNode.replaceChild(tail, end); tail.appendChild(end); } else sp.appendChild(tail);
        tail.appendChild(b);
        sp.addEventListener('click', async (ev) => {
          ev.stopPropagation(); await copyText(text); b.blur();
          b.innerHTML = ICON_DONE; sp.classList.add('done');
          setTimeout(() => { b.innerHTML = ICON_COPY; sp.classList.remove('done'); }, 2000);
        });
      });
    }
    // a chart with several frames (class "fr") shows them one after the other, three seconds each
    function animateFrames() {
      const charts = Array.from(document.querySelectorAll('.reveal .chart')).filter((c) => c.querySelector('.fr'));
      if (!charts.length) return;
      let step = 0;
      const show = () => charts.forEach((c) => { const fr = c.querySelectorAll('.fr'); fr.forEach((g, i) => { g.style.opacity = i === step % fr.length ? 1 : 0; }); });
      show(); setInterval(() => { step += 1; show(); }, 3000);
    }
    Reveal.initialize({ hash: true, slideNumber: 'c/t', transition: 'fade', width: 1280, height: 720, margin: 0.06, center: false,
      plugins: [ RevealMarkdown, RevealNotes ] }).then(() => { drawDiagrams(); document.querySelectorAll('.reveal a[href^="http"]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; }); addCopyButtons(); animateFrames(); Reveal.layout(); });
