Et qui vous appartient.
---
## Ce qui cloche dans toutes ces démos
- En fait, la limite, ce n'est plus l'IA...
- La limite, c'est **ce qu'elle sait de vous**
- Le problème, c'est **le (manque de) contexte**
- Chaque conversation **repart de zéro**, ou presque

Note: ESSENTIEL.
---
## La solution: une base de connaissances
<div class="chart strip"><svg viewBox="0 0 960 108" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Schéma: la partie en trois temps: un système, qui vous connaît, et qui vous appartient">

- **Votre base de connaissances**: toute l'information utile pour vous et/ou pour l'IA
- Dans cette partie, je vous montre **ce qui est possible**
- Deux mots nouveaux: une **note** est un fichier texte. **Obsidian** est une application qui sert à lire et à écrire ces notes

<p class="doc"><b>Documentation:</b> <a href="https://obsidian.md">Le site d'Obsidian (en anglais)</a></p>

Note: ESSENTIEL. Les trois temps se lisent comme une phrase: 1) un système, pour gérer vos connaissances (les capturer et les organiser, pour mieux les utiliser et vous décharger); 2) qui vous connaît, parce qu'il est nourri par vos notes; 3) et qui vous appartient, parce que ce sont vos fichiers. Le système de démo est fait avec AI Kit for Obsidian, mon kit pour Obsidian: le dire une fois, sans insister. Le message: ce qu'ils peuvent faire seuls est simple, et des fichiers locaux gardent leur liberté (changer d'IA, changer de fournisseur). Le système personnel de chacun est hors du cours: à dire à l'oral, si besoin.

## Les bases de la gestion des connaissances
<p class="step"><b>1 · Un système</b> &#8250; <span>2 · Qui vous connaît</span> &#8250; <span>3 · Et qui vous appartient</span></p>

- C'est **capturer et organiser** vos connaissances, pour **mieux les utiliser** et pour **vous décharger mentalement**
- **Capturer**: une idée, une décision, une chose à faire. Tout de suite, hors de votre tête
- **Organiser**: ranger dans **un seul endroit fiable**, pour retrouver vite
- **Utiliser**: retrouver, relier, décider. Vous, et l'IA
- Vous vous libérez l'esprit, et vous n'oubliez plus rien. L'IA y gagne **le contexte** qui lui manquait

Note: ESSENTIEL. Une minute. La gestion des connaissances n'est pas un outil: c'est une habitude. En une phrase: appliquer à ses propres informations les principes de la gestion des connaissances, pour mieux apprendre, mieux travailler et mieux décider. Le message: un seul endroit fiable, pour vous et pour l'IA. Les slides suivantes montrent comment commencer: décharger son cerveau, puis le journal du jour.

Note: ESSENTIEL. Message clé: on ne note pas "pour l'IA". On note d'abord pour soi, pour se décharger. L'IA en profite en plus. Le plus simple pour commencer: tout noter dans le journal du jour, et ranger plus tard. Exemple: un parent appelle pour la sortie P4. On note tout de suite ce qui est dit, ce qui est décidé et la suite. Les gens savent qu'on reviendra vers eux, parce que c'est écrit. Sans cette habitude, le reste ne marche pas: on ne peut ni ranger, ni relier, ni donner à l'IA ce qu'on n'a pas noté. Le revers à dire: l'IA produit vite, et on peut vite en faire trop. Vous faites travailler l'IA, ou est-ce l'IA qui vous fait travailler?

## Démo: Direction Saint-Exemple
Un système construit sur AI Kit for Obsidian, avec une direction fictive. Les demandes tiennent **en une ligne**:

> Prépare la sortie P4 du 26 novembre.

> Fais ma revue du lundi.

Puis la même demande **dans un chat vide**, pour comparer.

Pour essayer vous-mêmes: dézippez "Système Direction Saint-Exemple - notes seules (démo).zip" (dans "Fichiers de démo"), et choisissez ce dossier comme dossier de travail.

Note: ESSENTIEL. DÉMO SYSTÈME (5 min), à l'écran. Ouvrir le dossier "Système Direction Saint-Exemple - notes seules (démo)" (dézippé avant la séance) dans Obsidian, et Claude sur ce dossier. Les demandes et les réponses attendues sont dans "DEMO - À demander.txt", à la racine du système. Pour chaque demande, montrer la réponse, puis poser la même question dans un chat vide. Les cinq demandes: 1) "Prépare la sortie P4 du 26 novembre." 2) "Fais ma revue du lundi." 3) "Écris aux parents de P4 que le paiement est attendu avant le 19/11." 4) "Qu'est-ce que j'attends des autres, et qui dois-je relancer cette semaine?" 5) "Quelles actions de la circulaire 9847 touchent mes projets?" (joindre le PDF). En 5 minutes: faire 1 et 2. Les autres si le temps le permet. Le fichier finit par un tableau qui compare le chat, un projet Claude, la mémoire de Claude et ce système. Si le temps le permet, 2 minutes dans mon propre système: le genre de demandes que je lui fais chaque jour.

## Garder la maîtrise
1. **Ne pas dépendre** de Claude seul, ni de ses projets, ni de sa mémoire
2. Une base de connaissances **qui vous appartient**: des fichiers texte, sur votre PC ou votre OneDrive, lisibles sans aucun outil
3. **Personnelle et partagée**: chaque direction a la sienne, et une partie commune peut servir à toute l'école
4. **Libre de changer de fournisseur**: la même base sert avec Claude aujourd'hui, et avec un autre demain
5. **Vous décidez** ce que l'IA voit, dossier par dossier. Ce qu'elle lit part chez le fournisseur; vos fichiers, eux, restent chez vous
6. **Des fichiers, plutôt que des artefacts**: un artefact reste chez Anthropic. Ce qui doit durer devient un fichier, chez vous

Note: À PASSER si le temps manque.
---
## Sauvegardez votre base
- Votre base de connaissances devient **précieuse**: des années de travail
- **Au moins deux copies**, dont une hors de votre PC (un disque externe, un autre cloud)
- La synchronisation n'est pas une sauvegarde: une erreur ou une suppression se synchronise aussi
- Avant de laisser un agent travailler seul dans la base: **une sauvegarde récente**
- Testez de temps en temps: **savez-vous restaurer** un fichier?

Note: À PASSER si le temps manque.
---
## Ce qui passe quand même chez le fournisseur
- Le modèle reste un **service externe**
- Chaque demande passe chez le fournisseur choisi
- Ce qui ne dépend plus de lui: vos connaissances, votre organisation, vos processus
- Si demain un autre modèle est meilleur, ou européen, ou local, vous changez **sans rien perdre**

  <script>
    const render = (window.Pele && window.Pele.render) || null;
    function drawDiagrams() {
      if (!render) return;
      document.querySelectorAll('.reveal pre code.mermaid, .reveal pre code.language-mermaid').forEach((code) => {
        const pre = code.closest('pre');
        try { const { svg } = render(code.textContent); const d = document.createElement('div'); d.className = 'diagram pele'; d.innerHTML = svg; pre.replaceWith(d); }
        catch (e) { console.warn('Diagram failed', e); }
      });
    }
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); return; } catch (e) {}
      const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
      document.execCommand('copy'); t.remove();
    }
    const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
    const ICON_DONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';
    function addCopyButtons() {
      // boxed prompts: a "Copier" button in the corner
      document.querySelectorAll('.reveal .slides blockquote').forEach((bq) => {
        if (bq.closest('aside')) return;
        const text = bq.innerText.trim();
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'copy-btn'; b.textContent = 'Copier'; b.title = 'Copier la demande';
        b.addEventListener('click', async (ev) => {
          ev.stopPropagation(); await copyText(text); b.blur();
          b.textContent = 'Copié'; b.classList.add('done');
          setTimeout(() => { b.textContent = 'Copier'; b.classList.remove('done'); }, 2000);
        });
        bq.appendChild(b);
      });
      // short prompts inside the text: click the text or the icon
      document.querySelectorAll('.reveal .slides .cp').forEach((sp) => {
        if (sp.closest('aside')) return;
        const text = sp.innerText.trim().replace(/^"|"$/g, '');
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'copy-ico'; b.innerHTML = ICON_COPY; b.setAttribute('aria-label', 'Copier la demande');
        sp.title = 'Cliquer pour copier';
        // keep the icon on the same line as the last word
        const w = document.createTreeWalker(sp, NodeFilter.SHOW_TEXT); let last = null; while (w.nextNode()) last = w.currentNode;
        const tail = document.createElement('span'); tail.className = 'tail';
        if (last) { const end = last.splitText(last.data.lastIndexOf(' ') + 1); end.parentNode.replaceChild(tail, end); tail.appendChild(end); } else sp.appendChild(tail);
        tail.appendChild(b);
        sp.addEventListener('click', async (ev) => {
          ev.stopPropagation(); await copyText(text); b.blur();
          b.innerHTML = ICON_DONE; sp.classList.add('done');
          setTimeout(() => { b.innerHTML = ICON_COPY; sp.classList.remove('done'); }, 2000);
        });
      });
    }
    // a chart with several frames (class "fr") shows them one after the other, three seconds each
    function animateFrames() {
      const charts = Array.from(document.querySelectorAll('.reveal .chart')).filter((c) => c.querySelector('.fr'));
      if (!charts.length) return;
      let step = 0;
      const show = () => charts.forEach((c) => { const fr = c.querySelectorAll('.fr'); fr.forEach((g, i) => { g.style.opacity = i === step % fr.length ? 1 : 0; }); });
      show(); setInterval(() => { step += 1; show(); }, 3000);
    }
    Reveal.initialize({ hash: true, slideNumber: 'c/t', transition: 'fade', width: 1280, height: 720, margin: 0.06, center: false,
      plugins: [ RevealMarkdown, RevealNotes ] }).then(() => { drawDiagrams(); document.querySelectorAll('.reveal a[href^="http"]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; }); addCopyButtons(); animateFrames(); Reveal.layout();
        const next = () => document.querySelector('.nav-next').classList.toggle('show', Reveal.isLastSlide());
        next(); Reveal.on('slidechanged', next); });
  </script>
