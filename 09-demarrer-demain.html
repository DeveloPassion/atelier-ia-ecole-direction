<h2>9. Démarrer <span class="gradient">demain</span></h2>

Ce qu'il faut retenir, et quoi faire dès demain.
---
## À retenir

1. L'IA prédit, elle ne sait pas: **vérifiez**
2. La qualité de la réponse dépend du **contexte** que vous donnez
3. **Une conversation = un sujet**
4. **Elle propose, vous décidez**
5. Votre contexte est **votre actif**: gardez-le dans **votre base de connaissances**, et sauvegardez-la
6. **Écrivez vos processus**, et laissez l'IA les améliorer avec vous
---
## Trois actions pour demain
15 minutes, sans la fiche de contexte: la remplir demande plus de temps.

1. Créer le dossier de **votre base de connaissances**, sur votre PC, sauvegardé. Y mettre votre fichier **"À propos de moi.txt"** (vos réponses à la fiche de contexte), le règlement et le calendrier
2. Ouvrir Claude **sur ce dossier** (le dossier de travail)
3. Faire une **vraie tâche** de la semaine dans ce dossier: un mail, un tableau, une circulaire

Et chaque jour, 2 minutes: noter dans le **journal du jour**. Un dossier "Journal" dans votre base, un fichier texte par jour.
---
## Maintenant: votre vraie tâche
La tâche que vous avez choisie avant l'atelier. **Sans données sensibles.**

1. Ouvrez Claude sur une copie des fichiers utiles
2. Écrivez la demande avec la recette: **qui vous êtes, ce que vous voulez, pour qui, la forme, un exemple, les règles et les critères**. Les règles importantes vont **à la fin**
3. Demandez-lui de vous **poser ses questions** d'abord
4. Relisez, corrigez par petites phrases, et **vérifiez**
5. À la fin: <span class="cp">"Quelle demande t'aurait permis de faire ça du premier coup?"</span> **Gardez-la**

Note: VRAIE TÂCHE (6 min), chacun sur son PC. Leurs tâches sont dans leurs réponses aux trois questions (envoyées avant l'atelier, avec les prérequis). Passer de l'un à l'autre. Si une tâche est trop grosse: la couper et faire la première étape. Si quelqu'un n'a rien apporté: refaire le mot aux parents de la partie 1 pour sa propre classe, ou trier une vraie circulaire de la semaine. Finir par l'étape 5, et dire: "Gardez cette demande: c'est peut-être votre première skill."
---
## La fiche de contexte
- Un PDF de deux pages, avec 13 questions en quatre parties: qui je suis, mes objectifs, mon environnement, mes processus et mes règles
- Elle donne à l'IA **un petit point de départ**: qui vous êtes, ce que vous faites, comment vous travaillez. L'IA comprend mieux ce que vous lui demandez
- Les réponses vont dans le fichier texte **"À propos de moi.txt"** (sur la page d'accueil du support, avec les mêmes questions): l'IA lit un fichier texte bien plus facilement qu'un PDF
- Ce fichier sert aussi à initialiser votre base de connaissances, et le système de la phase 2
- Ensuite, c'est **la base** qui grandit: vos rôles, vos projets, vos personnes, vos processus

Note: Documents: "Fiche de contexte pour l'IA.pdf" (les champs se remplissent, le PDF donne le lien du fichier texte) et "À propos de moi.txt" (les mêmes questions, à remplir dans le Bloc-notes). En phase 2, le builder d'AI Kit for Obsidian demande d'abord si la personne a écrit ses réponses, lit le fichier là où il est (.docx, .pdf, .txt), montre un résumé à confirmer, et ne pose que les questions qui restent. Le fichier doit être sur le PC: un lien OneDrive ne s'ouvre pas, il faut d'abord le télécharger.
---
## Pour continuer seuls
1. Le mot aux parents: sans contexte, puis avec contexte. Comparez
2. Votre base de connaissances: le fichier "À propos de moi.txt" (l'école, votre rôle, votre ton, ce que Claude ne doit jamais faire) et deux documents. Ouvrez Claude sur ce dossier, et posez-lui trois questions de votre semaine
3. Claude ne lit pas ce fichier tout seul. Commencez chaque conversation par: <span class="cp">"Lis d'abord le fichier À propos de moi.txt."</span>
4. Préparer une réunion: joignez "Notes réunion équipe 2026-11-03 (brut)", demandez un ordre du jour et les points d'action, puis ce qui manque pour que chaque action soit claire

Refaites aussi les démos: les demandes à copier sont sur les slides des parties 3 et 6. Et gardez **l'aide-mémoire** (PDF de deux pages, à imprimer) à côté de votre PC.

Note: Pour le fichier "À propos de moi": l'application peut aussi lire seule un fichier d'instructions placé dans le dossier de travail. Le nom et le réglage dépendent de la version: à vérifier sur leur PC avant d'en parler. La phrase "Lis d'abord..." marche toujours. En phase 2, le système s'en occupe.
---
## Et après?
- Vos réponses aux **trois questions** d'avant l'atelier servent à la phase 2
- Ce qui vous a manqué aujourd'hui: dites-le-moi, par mail ou en séance 2
- Une deuxième séance est possible: pratique guidée, les questions notées pendant la séance, la base de connaissances et les skills de l'école, les connecteurs Microsoft 365

  <script>
    const render = (window.Pele && window.Pele.render) || null;
    function drawDiagrams() {
      if (!render) return;
      document.querySelectorAll('.reveal pre code.mermaid, .reveal pre code.language-mermaid').forEach((code) => {
        const pre = code.closest('pre');
        try { const { svg } = render(code.textContent); const d = document.createElement('div'); d.className = 'diagram pele'; d.innerHTML = svg; pre.replaceWith(d); }
        catch (e) { console.warn('Diagram failed', e); }
      });
    }
    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); return; } catch (e) {}
      const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
      document.execCommand('copy'); t.remove();
    }
    const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
    const ICON_DONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';
    function addCopyButtons() {
      // boxed prompts: a "Copier" button in the corner
      document.querySelectorAll('.reveal .slides blockquote').forEach((bq) => {
        if (bq.closest('aside')) return;
        const text = bq.innerText.trim();
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'copy-btn'; b.textContent = 'Copier'; b.title = 'Copier la demande';
        b.addEventListener('click', async (ev) => {
          ev.stopPropagation(); await copyText(text); b.blur();
          b.textContent = 'Copié'; b.classList.add('done');
          setTimeout(() => { b.textContent = 'Copier'; b.classList.remove('done'); }, 2000);
        });
        bq.appendChild(b);
      });
      // short prompts inside the text: click the text or the icon
      document.querySelectorAll('.reveal .slides .cp').forEach((sp) => {
        if (sp.closest('aside')) return;
        const text = sp.innerText.trim().replace(/^"|"$/g, '');
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'copy-ico'; b.innerHTML = ICON_COPY; b.setAttribute('aria-label', 'Copier la demande');
        sp.title = 'Cliquer pour copier';
        // keep the icon on the same line as the last word
        const w = document.createTreeWalker(sp, NodeFilter.SHOW_TEXT); let last = null; while (w.nextNode()) last = w.currentNode;
        const tail = document.createElement('span'); tail.className = 'tail';
        if (last) { const end = last.splitText(last.data.lastIndexOf(' ') + 1); end.parentNode.replaceChild(tail, end); tail.appendChild(end); } else sp.appendChild(tail);
        tail.appendChild(b);
        sp.addEventListener('click', async (ev) => {
          ev.stopPropagation(); await copyText(text); b.blur();
          b.innerHTML = ICON_DONE; sp.classList.add('done');
          setTimeout(() => { b.innerHTML = ICON_COPY; sp.classList.remove('done'); }, 2000);
        });
      });
    }
    // a chart with several frames (class "fr") shows them one after the other, three seconds each
    function animateFrames() {
      const charts = Array.from(document.querySelectorAll('.reveal .chart')).filter((c) => c.querySelector('.fr'));
      if (!charts.length) return;
      let step = 0;
      const show = () => charts.forEach((c) => { const fr = c.querySelectorAll('.fr'); fr.forEach((g, i) => { g.style.opacity = i === step % fr.length ? 1 : 0; }); });
      show(); setInterval(() => { step += 1; show(); }, 3000);
    }
    Reveal.initialize({ hash: true, slideNumber: 'c/t', transition: 'fade', width: 1280, height: 720, margin: 0.06, center: false,
      plugins: [ RevealMarkdown, RevealNotes ] }).then(() => { drawDiagrams(); document.querySelectorAll('.reveal a[href^="http"]').forEach((a) => { a.target = '_blank'; a.rel = 'noopener'; }); addCopyButtons(); animateFrames(); Reveal.layout(); });
  </script>
